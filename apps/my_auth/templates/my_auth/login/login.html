{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block title %}{% trans 'Авторизація' %}{% endblock %}

{% block content %}

{% include 'my_auth/login/_partials/breadcrumbs.html' %}

<div class="container g-min-height-200 g-py-70">

    <div class="row justify-content-center">
        <div class="col-md-12">
            <h3 class="h4 g-font-weight-300 g-mb-20">{% trans 'Будь-ласка, авторизуйтесь зручним для вас способом' %}:
            </h3>
        </div>

        <div class="col-md-12 g-mt-20">
            <login-form :auth-methods='{{ auth_methods_json|safe }}'
                secret="{{ request.session.secret|default:'' }}"
                next-url="{% if request.get_full_path not in request.META.HTTP_REFERER %}{{ request.META.HTTP_REFERER }}{% endif %}"
                euscp-url="{% static 'js/iit/euscp.js' %}"
                worker-url="{% static 'js/iit/euscp.worker.ex.js' %}">
            </login-form>
        </div>
    </div>

</div>

{% endblock %}
